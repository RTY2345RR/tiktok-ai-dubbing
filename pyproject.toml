[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "tiktok-ai-dubbing"
version = "0.1.0"
description = "TikTok AI dubbing CLI: dub TikTok, Instagram Reels and YouTube Shorts into another language in each speaker's cloned voice, with 9:16 word-highlight captions, SRT and a translated post caption. No GPU."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "RTY2345RR" }]
keywords = ["tiktok ai dubbing", "tiktok dubbing", "tiktok video translator", "tiktok translate video", "reels dubbing", "youtube shorts dubbing", "ai voiceover", "voice cloning", "video dubbing", "short form video", "captions", "srt", "yt-dlp"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Video",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = ["httpx>=0.27", "imageio-ffmpeg>=0.5", "yt-dlp"]

[project.optional-dependencies]
dev = ["pytest>=8", "build", "twine"]

[project.urls]
Homepage = "https://huggingface.co/spaces/miragea/tiktok-ai-dubbing"
Source = "https://github.com/RTY2345RR/tiktok-ai-dubbing"
Issues = "https://github.com/RTY2345RR/tiktok-ai-dubbing/issues"
"Voice engine" = "https://miragea.ai"

[project.scripts]
tiktok-ai-dubbing = "tiktok_ai_dubbing.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tiktok_ai_dubbing"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
